name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 手動 recursive 而不是 checkout 的 submodules: recursive：
      # 內層（librime/deps/*）pin 的是任意 commit，不是分支尖端，帶 --depth 會抓不到。
      - name: 取子模組（librime 一族＋ rime 資料）
        run: git submodule update --init --recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # 版本要跟 app/build.gradle.kts 的 ndkVersion 與 externalNativeBuild.cmake.version 一致，
      # 對不上 AGP 會自己再抓一份、或者乾脆報錯。
      # ⚠️ 這顆是 27.3 不是 r30：r30 下 librime 的 aarch64 連結會吃到 NDK 宿主端的
      #    libunwind.so（ld.lld: incompatible with aarch64linux），run 39722307748 實測紅。
      - name: 裝 NDK 與 CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" "ndk;27.3.13750724"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: 編 debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 檢查 libnative-lib 真的進了 APK
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/librime_jni.so'

      - name: 產物
        uses: actions/upload-artifact@v4
        with:
          name: t9-ime-debug
          path: app/build/outputs/apk/debug/*.apk
